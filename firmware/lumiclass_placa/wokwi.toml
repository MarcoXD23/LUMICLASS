# Wokwi para VS Code. Compila antes con:
#   arduino-cli compile --fqbn esp32:esp32:esp32 --output-dir build .
# y pon LUMICLASS_WOKWI en 1 dentro de config_pines.h (ver docs/HARDWARE.md, "Probar en Wokwi").
[wokwi]
version = 1
firmware = "build/lumiclass_placa.ino.bin"
elf = "build/lumiclass_placa.ino.elf"

# La placa simulada llega al servidor de este PC como http://host.wokwi.internal:8001
# (puerta de enlace privada de Wokwi para VS Code; no hace falta reenviar puertos).
